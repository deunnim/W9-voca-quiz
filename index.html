
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Quiz</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f1efff; color: #302b4b; font-family: system-ui, sans-serif; }
    main { width: min(100%, 520px); padding: 32px; border-radius: 28px; background: white; box-shadow: 0 14px 0 #e0dcf5, 0 22px 50px #45337615; }
    h1 { margin-top: 0; font-size: 24px; }
    h2 { font-size: 36px; margin: 24px 0; }
    p { line-height: 1.6; }
    #options { display: grid; gap: 12px; }
    button { font: inherit; cursor: pointer; border: 0; border-radius: 14px; padding: 16px; background: #efecff; color: #302b4b; }
    button:focus-visible { outline: 3px solid #7660da; outline-offset: 3px; }
    button:disabled { cursor: default; opacity: 1; }
    button.correct { background: #d7f5e6; }
    button.wrong { background: #ffe0e4; }
    #next, #restart, #start { background: #7358cf; color: white; width: 100%; margin-top: 16px; }
    #feedback { min-height: 28px; font-weight: 700; }
    #storage, #notice { font-size: 14px; color: #655e77; }
    #log { padding-left: 22px; font-size: 14px; line-height: 1.8; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Word Quiz</h1>
  <p id="notice">영어 단어 3문제 · 개인정보 입력 없이 참여해요.</p>
  <button id="start" type="button">퀴즈 시작</button>
  <section id="quiz" hidden aria-label="단어 퀴즈">
    <p id="progress"></p>
    <h2 id="word"></h2>
    <p>알맞은 뜻을 하나 골라 주세요.</p>
    <div id="options"></div>
    <p id="feedback" role="status" aria-live="polite"></p>
    <p id="storage" role="status" aria-live="polite"></p>
    <button id="next" type="button" hidden>다음 문제</button>
  </section>
  <section id="result" hidden>
    <h2 id="score" tabindex="-1"></h2>
    <p>문제별 저장 상태</p>
    <ul id="log" aria-live="polite"></ul>
    <button id="restart" type="button">다시 풀기</button>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL = "https://mtrtptjhphivitjmijaq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_mUCOPHzG7ZXI6OEoxnUxhw_W6Ah-Pn1";

let db = null;
let setupError = "";
try {
  if (SUPABASE_URL === "YOUR_SUPABASE_URL" ||
      SUPABASE_PUBLISHABLE_KEY === "YOUR_PUBLISHABLE_KEY") {
    throw new Error("Supabase URL과 publishable 키를 설정해 주세요.");
  }
  if (!window.supabase) throw new Error("Supabase CDN을 불러오지 못했습니다.");
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
} catch (error) {
  setupError = error.message;
}

const questions = [
  { word: "abundant", options: ["조용한", "풍부한", "위험한", "느린"], answer: "풍부한" },
  { word: "reluctant", options: ["주저하는", "열정적인", "정확한", "부지런한"], answer: "주저하는" },
  { word: "brief", options: ["강력한", "평범한", "짧은", "불규칙한"], answer: "짧은" }
];
const el = id => document.getElementById(id);
let run = null;
let index = 0;
let startedAt = 0;

function startQuiz() {
  if (!window.crypto || typeof window.crypto.randomUUID !== "function") {
    el("notice").textContent = "HTTPS 환경(GitHub Pages)에서 최신 브라우저로 열어 주세요.";
    return;
  }
  run = {
    id: crypto.randomUUID(),
    answers: [null, null, null],
    saves: ["미응답", "미응답", "미응답"]
  };
  index = 0;
  el("start").hidden = true;
  el("result").hidden = true;
  el("quiz").hidden = false;
  renderQuestion();
}

function renderQuestion() {
  const question = questions[index];
  el("progress").textContent = `${index + 1} / 3`;
  el("word").textContent = question.word;
  el("feedback").textContent = "";
  el("storage").textContent = "";
  el("next").hidden = true;
  el("next").textContent = index === 2 ? "결과 보기" : "다음 문제";
  el("options").replaceChildren();
  question.options.forEach(answer => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = answer;
    button.addEventListener("click", () => chooseAnswer(answer));
    el("options").appendChild(button);
  });
  // 화면 구성을 마친 뒤부터 첫 선택까지 측정합니다.
  startedAt = performance.now();
  el("options").firstElementChild.focus();
}

function chooseAnswer(answer) {
  const currentRun = run;
  const questionIndex = index;
  if (currentRun.answers[questionIndex] !== null) return;

  const question = questions[questionIndex];
  const elapsed = Math.min(
    2147483647,
    Math.max(0, Math.round(performance.now() - startedAt))
  );
  const correct = answer === question.answer;

  // 비동기 저장을 시작하기 전에 선택을 확정해 중복 클릭을 차단합니다.
  currentRun.answers[questionIndex] = correct;
  for (const button of el("options").children) {
    button.disabled = true;
    if (button.textContent === question.answer) button.classList.add("correct");
    else if (button.textContent === answer) button.classList.add("wrong");
  }
  el("feedback").textContent = correct
    ? "정답이에요! ✓"
    : `아쉬워요. 정답은 ‘${question.answer}’입니다.`;
  currentRun.saves[questionIndex] = "저장 중…";
  renderSaveStatus(currentRun, questionIndex);
  el("next").hidden = false;
  el("next").focus();

  // 한 문제당 한 번만 호출하며, 자동 재시도는 하지 않습니다.
  void saveAnswer(currentRun, questionIndex, {
    attempt_id: currentRun.id,
    question_no: questionIndex + 1,
    english_word: question.word,
    chosen_answer: answer,
    is_correct: correct,
    response_time_ms: elapsed
  });
}

async function saveAnswer(currentRun, questionIndex, payload) {
  try {
    if (!db) throw new Error(setupError || "저장 연결이 설정되지 않았습니다.");
    const { error } = await db.from("quiz_answers").insert(payload);
    if (error) throw error;
    currentRun.saves[questionIndex] = "저장 성공";
  } catch (error) {
    currentRun.saves[questionIndex] = "저장 실패 · 퀴즈는 계속할 수 있어요.";
    console.error("응답 저장 실패:", error.message);
  }
  renderSaveStatus(currentRun, questionIndex);
}

function renderSaveStatus(currentRun, questionIndex) {
  // 이전 응시의 늦은 응답이 새 응시 화면을 바꾸지 않도록 합니다.
  if (run !== currentRun) return;
  if (!el("quiz").hidden && index === questionIndex) {
    el("storage").textContent = currentRun.saves[questionIndex];
  }
  if (!el("result").hidden) renderLog();
}

function renderLog() {
  el("log").replaceChildren();
  run.saves.forEach((status, i) => {
    const item = document.createElement("li");
    item.textContent = `${i + 1}번 ${questions[i].word}: ${status}`;
    el("log").appendChild(item);
  });
}

el("next").addEventListener("click", () => {
  if (!run || run.answers[index] === null) return;
  if (index < 2) {
    index += 1;
    renderQuestion();
  } else {
    el("quiz").hidden = true;
    el("result").hidden = false;
    el("score").textContent = `${run.answers.filter(Boolean).length} / 3점`;
    renderLog();
    el("score").focus();
  }
});
el("start").addEventListener("click", startQuiz);
el("restart").addEventListener("click", startQuiz);
if (setupError) {
  el("notice").textContent = `${setupError} 퀴즈 연습은 가능합니다.`;
}
</script>
</body>
</html>
